[project]
name = "conversorsei"
version = "0.2.0"
description = "Conversor universal de documentos (DOCX, PDF, MD) para o padrão do editor SEI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
]

[project.scripts]
conversorsei = "conversorsei.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "segno>=1.6.6",
]
e2e = [
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conversorsei"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["conversorsei", "scripts"]
# O python-docx e o pypdf nao distribuem tipos completos
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# O teste no navegador (tests/test_navegador.py) fica fora da suíte padrão: precisa do
# Chromium do Playwright e de rede. Roda com "pytest -m e2e"; o -m da linha de comando
# substitui este
addopts = "-m 'not e2e'"
markers = ["e2e: abre a página no Chromium do Playwright (precisa de rede para o CDN do Pyodide)"]
